<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventario de Postes</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0066cc">

</head>

<body>

<div class="container">

<h1>📍 Inventario de Postes</h1>


<div class="card">

<label>Número de poste</label>
<input id="numeroPoste" type="text" placeholder="Ejemplo: 001">


<div class="checks">

<label>
<input type="checkbox" id="brazo">
Brazo
</label>

<label>
<input type="checkbox" id="clevis">
Clevis
</label>

<label>
<input type="checkbox" id="aislador">
Aislador
</label>

<label>
<input type="checkbox" id="cajaNap">
Caja NAP
</label>

</div>


<label>Color caja NAP</label>

<select id="color">
<option value="Blanco">Blanco</option>
<option value="Negro">Negro</option>
</select>



<button onclick="capturarFoto()">
📷 Tomar foto
</button>

<input 
type="file"
id="foto"
accept="image/*"
capture="environment"
hidden>


<button onclick="obtenerGPS()">
📍 Obtener ubicación GPS
</button>


<p id="ubicacion">
GPS pendiente
</p>


<button class="guardar"
onclick="guardarPoste()">
💾 Guardar registro
</button>

</div>



<div class="card">

<h2>Registros</h2>


<input 
id="buscar"
placeholder="Buscar poste..."
onkeyup="mostrarRegistros()">


<div class="tabla">

<table>

<thead>

<tr>

<th>Poste</th>
<th>Características</th>
<th>GPS</th>
<th>Acción</th>

</tr>

</thead>


<tbody id="tablaPostes">

</tbody>


</table>

</div>


</div>



<div class="card">

<button onclick="exportarPDF()">
📄 Exportar PDF
</button>


<button onclick="exportarExcel()">
📊 Exportar Excel
</button>


</div>


</div>



<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


<script src="app.js"></script>


<script>

if("serviceWorker" in navigator){

navigator.serviceWorker.register(
"service-worker.js"
);

}

</script>


</body>

</html>
