<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventario de Postes</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0066cc">

</head>


<body>


<div class="container">


<h1>📍 Inventario de Postes</h1>



<div class="card">


<h2>Nuevo Registro</h2>


<label>Proyecto</label>

<input 
id="proyecto"
placeholder="Ejemplo: Línea eléctrica XYZ">



<label>Etapa</label>

<select id="etapa">

<option value="Etapa 1">
Etapa 1
</option>

<option value="Etapa 2">
Etapa 2
</option>

<option value="Etapa 3">
Etapa 3
</option>

</select>



<label>Sector</label>

<select id="sector">

<option value="Sector A">
Sector A
</option>

<option value="Sector B">
Sector B
</option>

<option value="Sector C">
Sector C
</option>

</select>



<label>Número de poste</label>

<input
id="numeroPoste"
placeholder="001">



<div class="checks">


<label>
<input type="checkbox" id="brazo">
Brazo
</label>


<label>
<input type="checkbox" id="clevis">
Clevis
</label>


<label>
<input type="checkbox" id="aislador">
Aislador
</label>


<label>
<input type="checkbox" id="cajaNap">
Caja NAP
</label>


</div>



<label>Color Caja NAP</label>


<select id="color">

<option value="Blanco">
Blanco
</option>


<option value="Negro">
Negro
</option>


</select>



<button onclick="capturarFoto()">
📷 Tomar Foto
</button>


<input 
type="file"
id="foto"
accept="image/*"
capture="environment"
hidden>



<button onclick="obtenerGPS()">
📍 Obtener GPS
</button>


<p id="ubicacion">
GPS pendiente
</p>



<button 
class="guardar"
onclick="guardarPoste()">

💾 Guardar Registro

</button>



</div>





<div class="card">


<h2>Resumen</h2>


<p id="resumen">
Total registros: 0
</p>


</div>





<div class="card">


<h2>Buscar</h2>


<input
id="buscar"
placeholder="Buscar poste, etapa o sector"
onkeyup="mostrarRegistros()">



<h2>Registros</h2>


<div class="tabla">


<table>


<thead>


<tr>

<th>Etapa</th>

<th>Sector</th>

<th>Poste</th>

<th>Datos</th>

<th>GPS</th>

<th>Foto</th>

<th>Acción</th>

</tr>


</thead>



<tbody id="tablaPostes">


</tbody>



</table>



</div>


</div>





<div class="card">


<button onclick="exportarPDF()">

📄 Exportar PDF

</button>



<button onclick="exportarExcel()">

📊 Exportar Excel

</button>


</div>



</div>





<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>



<script src="app.js"></script>




<script>

if("serviceWorker" in navigator){

navigator.serviceWorker.register(
"service-worker.js"
);

}

</script>



</body>

</html>
